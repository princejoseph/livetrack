name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# A queued deploy should not overtake a running one, but never cancel a
# deploy mid-flight: an interrupted `fly deploy` can leave a stuck machine
# lease that blocks the next one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libyaml-dev sqlite3

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      # No setup-chrome step on purpose. The runner image already ships Google
      # Chrome with a matching chromedriver on PATH, and installing another one
      # produced a mismatch (chromedriver 153 vs the Chrome 152 Selenium
      # actually launched) that failed every system spec with
      # "session not created". Selenium Manager resolves the matched pair here;
      # CHROMEDRIVER_PATH is only set locally, where the PATH driver is stale.

      - name: Run tests
        env:
          RAILS_ENV: test
        run: bundle exec rspec

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capybara-screenshots
          path: tmp/capybara
          if-no-files-found: ignore

  deploy:
    # Nothing reaches Fly unless the whole suite passes.
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to Fly
        if: ${{ secrets.FLY_API_TOKEN != '' }}
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Skip rather than fail while the Fly side is not wired up yet, so the
      # test gate stays a useful signal instead of a permanently red build.
      - name: Skipped (no Fly token)
        if: ${{ secrets.FLY_API_TOKEN == '' }}
        run: |
          echo "::warning::FLY_API_TOKEN is not set, so the deploy was skipped."
          echo "Set it with: flyctl tokens create deploy | gh secret set FLY_API_TOKEN"
