development:
  adapter: async

# async, not :test -- the :test adapter captures broadcasts rather than
# delivering them, so HyperModel's real-time sync would never reach the
# browser during system specs.
test:
  adapter: async

production:
  adapter: redis
  url: <%= ENV.fetch("REDIS_URL") { "redis://localhost:6379/1" } %>
  channel_prefix: livetrack_production
