development:
  adapter: async

# async, not :test -- the :test adapter captures broadcasts rather than
# delivering them, so HyperModel's real-time sync would never reach the
# browser during system specs.
test:
  adapter: async

# async keeps broadcasts in-process, which is correct for a single-machine
# deploy and needs no Redis. If this ever scales past one process, every
# process needs a shared adapter (redis) or clients will only see the
# broadcasts raised by the process they happen to be connected to.
production:
  adapter: async
