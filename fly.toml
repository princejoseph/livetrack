# fly.toml — livetrack
#
# IMPORTANT: this app must run as a SINGLE machine.
# config/cable.yml uses the in-process `async` ActionCable adapter, so a
# broadcast raised on one machine is only delivered to the clients connected
# to that same machine. Scaling past one instance silently breaks the live
# map for a fraction of users. Moving beyond one machine means adding Redis
# and switching the production adapter.

app = 'livetrack'
primary_region = 'iad'
console_command = '/rails/bin/rails console'

[build]

[http_service]
  # Thruster listens here and proxies to Puma, serving the ~2.5MB Opal bundle
  # gzipped and with far-future caching. Above 1024 because the container runs
  # as a non-root user and cannot bind a privileged port (see Dockerfile).
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  # Keep one machine up: a suspended machine drops every open WebSocket, and
  # this app's whole point is a live connection.
  min_machines_running = 1
  max_machines_running = 1
  processes = ['app']

  # Thruster binds :8080 and reports reachable a second or two before Puma is
  # accepting on :3000, so without a readiness check Fly routes into that
  # window and the first request after a start returns 502 ("Unable to proxy
  # request ... dial tcp 127.0.0.1:3000: connection refused"). /up is Rails'
  # own health endpoint and is excluded from the logs by
  # config.silence_healthcheck_path.
  [[http_service.checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/up"

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

# No [mounts]. SQLite lives at storage/production.sqlite3 on the ephemeral
# filesystem and is recreated empty on each boot -- positions are live data
# with no value after a restart, so there is nothing to persist.
